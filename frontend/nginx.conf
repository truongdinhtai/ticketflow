server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so upstreams are resolved at request time
    # (a stopped service becomes a 502 the health page reads as DOWN,
    # rather than failing Nginx at startup).
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 4s;
    proxy_read_timeout 10s;

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls -> API Gateway (keeps the /api prefix the gateway expects).
    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health probes -> each service's /actuator/health.
    location = /health/gateway      { set $u http://api-gateway:8080;         rewrite ^ /actuator/health break; proxy_pass $u; }
    location = /health/config       { set $u http://config-server:8888;       rewrite ^ /actuator/health break; proxy_pass $u; }
    location = /health/discovery    { set $u http://discovery-server:8761;    rewrite ^ /actuator/health break; proxy_pass $u; }
    location = /health/auth         { set $u http://auth-service:8084;         rewrite ^ /actuator/health break; proxy_pass $u; }
    location = /health/event        { set $u http://event-service:8081;        rewrite ^ /actuator/health break; proxy_pass $u; }
    location = /health/booking      { set $u http://booking-service:8082;      rewrite ^ /actuator/health break; proxy_pass $u; }
    location = /health/notification { set $u http://notification-service:8083; rewrite ^ /actuator/health break; proxy_pass $u; }
}
