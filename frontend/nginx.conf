server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_connect_timeout 4s;
    proxy_read_timeout 10s;

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health both go to the gateway (it routes /api/* and /health/*).
    # The service name "api-gateway" resolves in Docker Compose and Kubernetes.
    # Used only when the frontend is served here (same-origin); when the frontend
    # is on Cloudflare Pages it calls the gateway directly via VITE_API_BASE_URL.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health/ {
        proxy_pass http://api-gateway:8080;
    }
}
