# HorizontalPodAutoscaler for Booking Service — the main load-bearing service.
# Requires the metrics-server (minikube: `minikube addons enable metrics-server`;
# EKS/most clusters ship it). Scales 2..6 replicas targeting 70% CPU of the
# request (200m), so pods are added when sustained CPU exceeds ~140m each.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
  namespace: ticketflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
