# Auth / Event / Booking / Notification services. Each pulls shared config from
# the ConfigMap and credentials from the Secret via envFrom (unused keys are
# simply ignored by each service).
# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ticketflow/auth-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ticketflow-config }
            - secretRef: { name: ticketflow-secrets }
          ports: [{ containerPort: 8084 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 700m, memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ticketflow
spec:
  selector: { app: auth-service }
  ports: [{ port: 8084, targetPort: 8084 }]
---
