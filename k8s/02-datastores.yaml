# --- PostgreSQL: one instance hosting all four service databases ---
# For AWS, delete this and point the *_DB_URL ConfigMap entries at RDS instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ticketflow
data:
  init.sql: |
    CREATE DATABASE booking_db;
    CREATE DATABASE notification_db;
    CREATE DATABASE auth_db;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ticketflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: ticketflow-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ticketflow-secrets, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              value: event_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "ticketflow"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-pvc } }
        - { name: init, configMap: { name: postgres-init } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ticketflow
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# --- Redis (Booking Service cache) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ticketflow
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# --- Mailpit (captures notification emails; arm64-compatible) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.20
          ports:
            - { containerPort: 1025 }
            - { containerPort: 8025 }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ticketflow
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: ui, port: 8025, targetPort: 8025 }
