# Config served by Config Server to the Eureka discovery server.
server:
  port: ${SERVER_PORT:8761}

eureka:
  client:
    # A standalone Eureka server must not try to register with or fetch
    # from itself. This overrides the shared defaults in application.yml.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Disable self-preservation in local/dev so dead instances expire quickly.
    enable-self-preservation: false
