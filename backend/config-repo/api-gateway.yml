# Config served by Config Server to the API Gateway.
server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      # Do NOT auto-create routes from every registered service; we declare
      # them explicitly below for a predictable public API surface.
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**

# Notification Service is intentionally NOT routed: it is a Kafka consumer with
# no public REST API.

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
