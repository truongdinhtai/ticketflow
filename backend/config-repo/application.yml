# =====================================================================
# Shared configuration served by the Config Server to EVERY client
# service (via the "native" profile reading this directory).
# Service-specific overrides live in <service-name>.yml next to this file.
# =====================================================================

# --- Service discovery: how every service registers with Eureka ---
eureka:
  client:
    service-url:
      # Overridden to the container hostname via EUREKA_SERVER env in docker-compose
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # Include the instance id so tracing/log correlation is easier
    instance-id: ${spring.application.name}:${random.value}

# --- Actuator: expose health/info/metrics/prometheus for observability ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  # --- Distributed tracing via Micrometer Tracing + Zipkin (Boot 3 way) ---
  tracing:
    sampling:
      # Sample 100% of requests in this demo; lower in production
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- Shared JWT settings: auth-service signs tokens, gateway verifies them ---
ticketflow:
  jwt:
    # HS256 secret (>= 32 bytes). Demo default; override with JWT_SECRET in prod.
    secret: ${JWT_SECRET:ZmFrZS1kZW1vLXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA}
    # Access token lifetime in milliseconds (24h).
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# --- Baseline logging levels (JSON encoder is wired via logback-spring.xml) ---
logging:
  level:
    root: INFO
    com.ticketflow: DEBUG
    org.springframework.web: INFO
