# =====================================================================
# TicketFlow — full local stack.
#   docker compose up --build
# Then:
#   Eureka        http://localhost:8761
#   Gateway       http://localhost:8080
#   Zipkin        http://localhost:9411
#   MailHog UI    http://localhost:8025
#   Swagger       http://localhost:8081/swagger-ui.html (event)
#                 http://localhost:8082/swagger-ui.html (booking)
# =====================================================================

name: ticketflow

# ---- Shared environment for the Spring Boot services ----
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker            # JSON logging via logback-spring.xml
  CONFIG_IMPORT: optional:configserver:http://config-server:8888
  EUREKA_SERVER: http://discovery-server:8761/eureka/
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

services:
  # ================= Infrastructure =================
  config-server:
    build:
      context: ./backend
      dockerfile: infra-config-server/Dockerfile
    image: ticketflow/config-server
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: native        # config server must keep the native profile
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./backend/config-repo:/config-repo:ro        # serve config from the mounted repo
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8888' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  discovery-server:
    build:
      context: ./backend
      dockerfile: infra-discovery-server/Dockerfile
    image: ticketflow/discovery-server
    container_name: discovery-server
    environment:
      CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    image: ticketflow/api-gateway
    container_name: api-gateway
    environment:
      <<: *service-env
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ================= Datastores =================
  event-db:
    image: postgres:16-alpine
    container_name: event-db
    environment:
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketflow}
      POSTGRES_DB: event_db
    ports:
      - "5433:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketflow} -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketflow}
      POSTGRES_DB: booking_db
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketflow} -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketflow}
      POSTGRES_DB: notification_db
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketflow} -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketflow}
      POSTGRES_DB: auth_db
    ports:
      - "5436:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketflow} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ================= Messaging =================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"                          # host access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: in-network clients use kafka:29092, host tools use localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ================= Observability & mail =================
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"                          # SMTP
      - "8025:8025"                          # web UI

  # ================= Business services =================
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: ticketflow/auth-service
    container_name: auth-service
    environment:
      <<: *service-env
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USER: ${DB_USER:-ticketflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticketflow}
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-db:
        condition: service_healthy

  event-service:
    build:
      context: ./backend
      dockerfile: event-service/Dockerfile
    image: ticketflow/event-service
    container_name: event-service
    environment:
      <<: *service-env
      EVENT_DB_URL: jdbc:postgresql://event-db:5432/event_db
      DB_USER: ${DB_USER:-ticketflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticketflow}
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      event-db:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend
      dockerfile: booking-service/Dockerfile
    image: ticketflow/booking-service
    container_name: booking-service
    environment:
      <<: *service-env
      BOOKING_DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      DB_USER: ${DB_USER:-ticketflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticketflow}
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    image: ticketflow/notification-service
    container_name: notification-service
    environment:
      <<: *service-env
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      DB_USER: ${DB_USER:-ticketflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticketflow}
      KAFKA_BROKERS: kafka:29092
      # Defaults target the MailHog container; override via .env.local (loaded
      # with `--env-file .env --env-file .env.local`) to send real email.
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ticketflow.local}
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started

  # ================= Frontend =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ticketflow/frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  event-db-data:
  booking-db-data:
  notification-db-data:
  auth-db-data:
